<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="t">
  <title id="t">Abhinav Singh – Shades of India</title>
  <defs>
    <!-- top text runs left→right over the top; bottom text runs left→right under the bottom -->
    <path id="arc-top" d="M 24 100 A 76 76 0 0 1 176 100" />
    <path id="arc-bottom" d="M 13 100 A 87 87 0 0 0 187 100" />

    <!-- full India outline -->
    <path id="india"
          d="M 76.2 47.6 L 79.0 49.1 L 81.1 51.7 L 83.9 52.9 L 86.3 53.2 L 88.4 51.7 L 91.1 51.0 L 94.3 52.1 L 94.9 54.7 L 93.6 57.7 L 90.8 58.8 L 89.8 61.5 L 92.2 63.7 L 90.1 65.2 L 88.4 64.8 L 89.8 68.2 L 89.8 70.4 L 94.6 73.4 L 97.8 74.2 L 94.3 78.6 L 105.7 83.9 L 111.3 86.9 L 122.0 87.6 L 122.4 82.0 L 124.8 84.2 L 127.9 86.5 L 135.9 86.1 L 134.1 82.4 L 144.2 77.1 L 150.1 76.4 L 154.2 80.9 L 146.6 86.9 L 144.5 92.1 L 140.0 100.3 L 137.6 104.4 L 136.2 97.7 L 134.1 100.3 L 132.8 96.2 L 136.6 93.2 L 127.9 91.7 L 123.1 95.1 L 124.8 102.2 L 124.8 105.6 L 117.9 106.7 L 111.6 113.4 L 101.9 124.2 L 95.0 128.3 L 95.0 136.6 L 93.6 147.8 L 87.7 153.0 L 85.3 156.0 L 81.1 150.4 L 76.6 139.2 L 73.5 130.6 L 69.7 119.0 L 69.0 113.0 L 68.3 106.3 L 68.0 102.9 L 62.8 108.5 L 55.8 102.6 L 60.0 100.7 L 53.8 98.1 L 55.1 95.5 L 62.8 95.1 L 59.6 87.2 L 57.6 85.4 L 61.4 81.6 L 69.4 74.5 L 75.2 70.4 L 76.6 65.2 L 73.5 63.7 L 71.7 62.2 L 72.4 58.5 L 70.7 55.8 L 68.6 53.2 L 67.2 50.6 L 69.7 48.7 L 73.1 48.4 Z" />

    <!-- mountain range across the north of the map -->
    <path id="ridge" d="M 58 109 L 66 100 L 72 103 L 80 92 L 90 99 L 100 91 L 108 99 L 113 96 L 122 105" />

    <!-- everything inside the map stays inside it, with a small gap from the outline -->
    <mask id="inside-india" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <use href="#india" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round" />
    </mask>

    <!-- the sun is hidden below the mountains -->
    <mask id="above-ridge" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff" />
      <path d="M 58 109 L 66 100 L 72 103 L 80 92 L 90 99 L 100 91 L 108 99 L 113 96 L 122 105 L 122 200 L 58 200 Z"
            fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round" />
    </mask>
  </defs>

  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- rings -->
    <circle cx="100" cy="100" r="96" stroke-width="3" />
    <circle cx="100" cy="100" r="68" stroke-width="1.5" />

    <!-- map, centred in the badge -->
    <g transform="translate(100 100) translate(-104 -101.8)">
      <g mask="url(#inside-india)">
        <!-- sun rising between two peaks -->
        <g mask="url(#above-ridge)">
          <circle cx="90" cy="92" r="7.5" stroke-width="1.5" />
          <g stroke-width="1.3">
            <line x1="90" y1="82" x2="90" y2="78.5" />
            <line x1="95.7" y1="83.8" x2="97.7" y2="80.9" />
            <line x1="84.3" y1="83.8" x2="82.3" y2="80.9" />
            <line x1="99.4" y1="88.6" x2="102.7" y2="87.4" />
            <line x1="80.6" y1="88.6" x2="77.3" y2="87.4" />
          </g>
        </g>

        <!-- mountains -->
        <use href="#ridge" stroke-width="1.6" />
        <!-- snow lines on the tallest peaks -->
        <g stroke-width="1">
          <path d="M 77.3 95.7 L 80 94.2 L 82.5 95.8" />
          <path d="M 96.3 94 L 100 93 L 103 94" />
        </g>

        <!-- rivers -->
        <g stroke-width="1.1">
          <!-- Ganga: from the mountains east to the Bay of Bengal -->
          <path d="M 87 104 C 93 108, 99 104, 106 107 S 115 104.5, 120 106.5" />
          <!-- Brahmaputra: through the north-east, then south into Bengal -->
          <path d="M 151 81 C 144 83.5, 137 84, 131.5 88 S 125 92, 124 98" />
          <!-- Narmada: across the middle to the Arabian Sea -->
          <path d="M 96 111 C 90 113, 84 109, 78 110.5 S 71 106, 67 105" />
          <!-- Godavari: across the Deccan to the east coast -->
          <path d="M 75 115 C 82 119, 88 113.5, 94 117 S 101 121.5, 105 121" />
          <!-- Kaveri: in the south -->
          <path d="M 79 137 C 84 139.5, 88 134, 94 136" />
        </g>
      </g>

      <!-- India -->
      <use href="#india" stroke-width="2" />
    </g>
  </g>

  <!-- ring text -->
  <g fill="currentColor" font-family="'Work Sans', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="12.5" letter-spacing="3.2">
    <text text-anchor="middle"><textPath href="#arc-top" startOffset="50%">ABHINAV SINGH</textPath></text>
    <text text-anchor="middle" font-size="11" letter-spacing="3.4"><textPath href="#arc-bottom" startOffset="50%">SHADES OF INDIA</textPath></text>
  </g>
  <!-- separators at 9 and 3 o'clock -->
  <g fill="currentColor">
    <circle cx="18" cy="100" r="2" />
    <circle cx="182" cy="100" r="2" />
  </g>
</svg>
